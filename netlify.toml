# Netlify: conecta el repositorio y define SITE_URL en Site settings → Environment variables.
# Las cabeceras de seguridad se aplican desde dist/_headers (generado en cada build).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"
