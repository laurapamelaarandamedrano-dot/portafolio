version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier*', 'globals']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
